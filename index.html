:root{
  --rc-paper:#FCF7FD;
  --rc-white:#FDFDFD;
  --rc-desktop-a:#F6E7FC;
  --rc-desktop-c:#F4DBF9;
  --rc-pink:#F9D7EF;
  --rc-pink-hot:#EB8CEA;
  --rc-violet:#8414D0;
  --rc-violet-2:#5945B6;
  --rc-cyan:#4AE1FC;
  --rc-ink:#1A1227;
  --rc-lav:#EBD2F9;
  --rc-violet-lt:#B79BDF;
  --rc-font:"DinkieBitmap","PixelMplus12","Zpix","MS Gothic",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{
  min-height:100vh;
  color:var(--rc-ink);
  font-family:var(--rc-font);
  font-size:13px;
  line-height:1.8;
  -webkit-font-smoothing:none;
  text-rendering:geometricPrecision;
  background-color:var(--rc-desktop-a);
  background-image:
    linear-gradient(45deg,var(--rc-desktop-c) 25%,transparent 25%,transparent 75%,var(--rc-desktop-c) 75%,var(--rc-desktop-c)),
    linear-gradient(45deg,var(--rc-desktop-c) 25%,transparent 25%,transparent 75%,var(--rc-desktop-c) 75%,var(--rc-desktop-c));
  background-size:40px 40px;
  background-position:0 0,20px 20px;
}

/* 紫/青径向光晕（raincandy ::before 原样保留） */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9996;
  background:
    radial-gradient(120% 80% at 50% 120%,rgba(120,60,180,.18),transparent 60%),
    radial-gradient(120% 80% at 50% -20%,rgba(120,200,255,.20),transparent 60%);
}

::selection{background:var(--rc-pink-hot);color:#fff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--rc-lav)}
::-webkit-scrollbar-thumb{background:var(--rc-violet-lt);border:1px solid var(--rc-violet)}

/* ---------- 顶栏 ---------- */
.topline{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:8px;
  background:var(--rc-lav);
  border-bottom:2px solid var(--rc-violet-2);
  box-shadow:0 2px 0 rgba(107,91,196,.35);
  padding:7px 14px;
}
.brand{
  display:flex;align-items:center;
  color:var(--rc-violet);letter-spacing:1.5px;font-size:13.5px;
}
.brand::before{
  content:"";display:inline-block;width:10px;height:10px;
  background:var(--rc-violet);margin-right:6px;vertical-align:-1px;
}

/* ---------- 主体：标题 + 两个小框，整页居中 ---------- */
.wrap{
  min-height:calc(100vh - 40px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:32px;padding:28px 14px 64px;
}

h1{
  margin:0;
  font-size:clamp(23px,4.4vw,34px);
  font-weight:400;
  letter-spacing:3px;
  color:var(--rc-violet);
  text-shadow:3px 3px 0 var(--rc-cyan);
  line-height:1.4;
}

.games{
  list-style:none;margin:0;padding:0;
  display:flex;flex-wrap:wrap;gap:20px;justify-content:center;
}

/* 小框：复刻 raincandy 窗口（标题条 + □ ×） */
.game{
  position:relative;display:block;
  width:186px;height:124px;
  padding-top:24px;
  background:var(--rc-white);
  border:2px solid var(--rc-violet-2);
  box-shadow:0 0 0 1px var(--rc-cyan) inset, 3px 3px 0 rgba(132,20,208,.30);
  text-decoration:none;
  color:var(--rc-ink);
  transition:background .12s, box-shadow .12s, transform .12s;
}
.game .bar{
  position:absolute;left:-2px;right:-2px;top:-2px;
  display:flex;align-items:center;gap:6px;
  height:24px;padding:0 7px;
  background:var(--rc-lav);
  border-bottom:1px solid var(--rc-violet);
  font-size:11.5px;letter-spacing:.5px;white-space:nowrap;
}
.game .bar::before{
  content:"";width:8px;height:8px;background:var(--rc-violet);flex:none;
}
.game .bar::after{
  content:"□ ×";margin-left:auto;color:var(--rc-violet);
  font-size:10px;letter-spacing:2px;
}
.game .glyph{
  display:grid;place-items:center;
  height:100%;font-size:38px;line-height:1;
  color:var(--rc-violet);
  transition:color .12s;
}

.game:hover{
  background:var(--rc-pink);
  box-shadow:0 0 0 1px var(--rc-cyan) inset, 5px 5px 0 rgba(132,20,208,.35);
  transform:translate(-1px,-1px);
}
.game:hover .glyph{color:var(--rc-pink-hot)}
.game:active{
  transform:translate(2px,2px);
  box-shadow:0 0 0 1px var(--rc-cyan) inset, 1px 1px 0 rgba(132,20,208,.30);
}
.game:focus-visible{
  outline:2px solid var(--rc-pink-hot);
  outline-offset:2px;
}

@media (max-width:440px){
  .wrap{gap:24px}
  h1{letter-spacing:2px;text-shadow:2px 2px 0 var(--rc-cyan)}
  .game{width:160px;height:114px}
  .game .glyph{font-size:32px}
}
</style>
</head>
<body>

<header class="topline">
  <span class="brand">aliceliddell.top</span>
</header>

<main class="wrap">
  <h1>Alice的小站</h1>

  <ul class="games">
    <li>
      <a class="game" href="/president-sim/">
        <span class="bar">总统模拟器</span>
        <span class="glyph">🏛</span>
      </a>
    </li>
    <li>
      <a class="game" href="/mine-knight/">
        <span class="bar">马步扫雷</span>
        <span class="glyph">♘</span>
      </a>
    </li>
  </ul>
</main>
