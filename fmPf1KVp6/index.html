<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Never Gonna Give You Up</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0710'/><text x='16' y='24' font-size='20' text-anchor='middle'>%E2%96%B6</text></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0710;overflow:hidden}
  body{display:grid;place-items:center;font-family:system-ui,"Microsoft YaHei",sans-serif}

  video{
    display:block;width:100%;height:100%;
    object-fit:contain;background:#000;
  }

  /* 仅当处于静音播放时，右上角出现的小提示；绝不遮挡画面 */
  #sound{
    position:fixed;top:14px;right:14px;z-index:10;
    display:none;align-items:center;gap:8px;
    padding:9px 15px;cursor:pointer;
    font:inherit;font-size:13px;letter-spacing:1px;
    color:#fff;background:#EB8CEA;
    border:3px solid #5945B6;border-radius:0;
    box-shadow:4px 4px 0 #8414D0;
    transition:background .12s,color .12s,box-shadow .12s;
  }
  #sound.on{display:flex}
  #sound:hover{background:#fff;color:#8414D0;box-shadow:4px 4px 0 #4AE1FC}
  #sound:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #8414D0}
</style>
</head>
<body>

<video id="v" src="never-gonna-give-you-up.mp4" controls playsinline preload="auto"></video>
<button id="sound" type="button">🔊 开启声音</button>

<script>
(function(){
  var v   = document.getElementById('v');
  var btn = document.getElementById('sound');

  // 提示只在「正在播放 且 静音」时出现
  function sync(){
    if (!v.paused && v.muted) {
      btn.textContent = '🔊 开启声音';
      btn.classList.add('on');
    } else {
      btn.classList.remove('on');
    }
  }

  // 优先有声自动播放；被策略拦截则静音播放
  var p = v.play();
  if (p && p.catch) {
    p.catch(function(){
      v.muted = true;
      var p2 = v.play();
      if (p2 && p2.catch) {
        p2.catch(function(){
          // 连静音播放都被拒：只能等用户点一下
          btn.textContent = '▶ 播放';
          btn.classList.add('on');
        });
      }
    });
  }

  btn.addEventListener('click', function(){
    if (v.paused) {
      v.muted = false;
      v.volume = 1;
      var p3 = v.play();
      if (p3 && p3.catch) p3.catch(function(){});
    } else {
      v.muted = false;
      v.volume = 1;
    }
    sync();
  });

  v.addEventListener('playing', sync);
  v.addEventListener('pause', function(){ btn.classList.remove('on'); });
  v.addEventListener('volumechange', sync);
  v.addEventListener('ended', function(){ btn.classList.remove('on'); });
})();
</script>

</body>
</html>
