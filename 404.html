<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — 页面不存在</title>
<style>
  :root{ --bg:#0f1115; --fg:#e8eaed; --muted:#9aa3ad; --accent:#7fb7ff; }
  @media (prefers-color-scheme: light){ :root{ --bg:#fbfbfd; --fg:#1b1f24; --muted:#5f6b78; --accent:#1b62c9; } }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    display:grid; place-items:center; text-align:center;
    font:16px/1.7 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding:24px;
  }
  h1{ font-size:clamp(4rem,18vw,9rem); margin:0; letter-spacing:-.04em; line-height:1; color:var(--muted); font-weight:700; }
  p{ color:var(--muted); margin:18px 0 30px; }
  a{ color:var(--accent); text-decoration:none; border:1px solid var(--accent); border-radius:999px; padding:9px 22px; font-size:.9rem; }
  a:hover{ background:var(--accent); color:var(--bg); }
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>这个页面不存在，或者被移走了。</p>
    <a href="/">回首页</a>
  </div>
</body>
</html>
